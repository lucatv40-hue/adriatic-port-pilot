name: Vento ICON-2I ogni sei ore

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: wind-grid-delivery
  cancel-in-progress: false

jobs:
  prepare:
    # Explicit opt-in: connecting GitHub must not incur unexpected runner costs.
    if: vars.WIND_GRID_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/wind-grid/requirements.txt
      - name: Test delle regole di pubblicazione
        working-directory: tools/wind-grid
        run: python -B -m unittest test_automation.py -v
      - name: Trova ultima previsione ufficiale completa
        id: discover
        run: python -B tools/wind-grid/automate.py --discover
      - name: Riusa download della stessa emissione
        uses: actions/cache@v4
        with:
          path: .wind-cache
          key: wind-input-v1-${{ steps.discover.outputs.run }}
      - name: Conserva indirizzi delle previsioni precedenti
        uses: actions/cache@v4
        with:
          path: .wind-site
          key: wind-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wind-site-v1-
      - name: Installa convertitore esterno
        run: python -m pip install -r tools/wind-grid/requirements.txt
      - name: Scarica, verifica e prepara 48 ore
        env:
          MODEL_RUN: ${{ steps.discover.outputs.run }}
        run: python -B tools/wind-grid/automate.py --run "$MODEL_RUN"
      - name: Onde Copernicus Marine (48 ore)
        env:
          CMEMS_USER: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -z "$CMEMS_USER" ]; then echo 'Credenziali Copernicus mancanti'; exit 0; fi
          python -m pip install -r tools/wave-grid/requirements.txt
          python -B tools/wave-grid/fetch.py .wind-site
      - name: Pubblica su branch gh-pages (senza artifact)
        if: vars.WIND_GRID_PAGES == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .wind-site
          publish_branch: gh-pages
          force_orphan: true
